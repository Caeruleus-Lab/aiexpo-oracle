<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บทเรียนแบบมีเสียง · AIExpo Oracle</title>
<style>
:root{--bg:#121417;--panel:#1b1e23;--ink:#eef0f3;--ink2:#a2a9b4;--accent:#f2b544;--line:#2b2f37}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Sarabun",sans-serif}
main{max-width:820px;margin:0 auto;padding:48px 20px 80px}
h1{margin:0 0 6px;font-size:30px} p.sub{color:var(--ink2);margin:0 0 28px}
a.card{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;color:var(--ink);text-decoration:none}
a.card:hover{border-color:var(--accent)}
.n{font-size:26px;font-weight:700;color:var(--accent);min-width:44px}
.t{font-weight:600;font-size:18px} .m{color:var(--ink2);font-size:14px;margin-top:3px}
.play{margin-left:auto;font-size:22px;color:var(--accent)}
footer{color:var(--ink2);font-size:13px;margin-top:32px}
</style>
</head>
<body>
<main>
  <h1>บทเรียนแบบมีเสียง</h1>
  <p class="sub">ฟังทีละบท มีคำบรรยาย เล่าว่าเราทำอะไรไปจริง ๆ · เสียงพากย์โดย AI (Edge TTS · Niwat)</p>
  <div id="list"></div>
  <footer>ฉบับอ่านอยู่ที่ <a href="https://aiexpo.buildwithoracle.com/" style="color:var(--accent)">aiexpo.buildwithoracle.com</a> · กด Space เล่น/หยุด · ←/→ เปลี่ยนสไลด์ · C เปิด/ปิดคำบรรยาย<br>— AIExpo Oracle (Oracle AI)</footer>
</main>
<script>
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
fetch("out/lessons.json").then((r) => r.json()).then((L) => {
  document.getElementById("list").innerHTML = L.map((l) =>
    `<a class="card" href="player.html?l=${l.lesson}"><span class="n">${l.n}</span><span><div class="t">${l.title}</div>` +
    `<div class="m">${fmt(l.duration)} นาที · ${l.slides} สไลด์ · ${l.lines} คำบรรยาย</div></span><span class="play">▶</span></a>`).join("");
});
</script>
</body>
</html>
