<meta name="color-scheme" content="dark light">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1217">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f5ef">
<script>(function(){var t;try{t=localStorage.getItem('aiexpo-theme')}catch(e){}document.documentElement.dataset.theme=t||(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')})()</script>
